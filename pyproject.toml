[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "repo-agent"
version = "0.1.0"
description = "Self-CRAG GitHub Repo Agent with LangGraph"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
